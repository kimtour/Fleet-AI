name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests
      - run: python -m eval.mutation_check
      - run: pip install build
      - run: python -m build --wheel
  langgraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {version: "0.10.4"}
      - run: uv sync --locked --extra langgraph
      - run: uv run python -m unittest discover -s tests
      - run: uv run python -m eval.mutation_check
      - run: uv run python -m fleet_copilot --backend langgraph --tenant acme-001 ask "Which devices at Acme are low on disk space?"
      - run: uv build --wheel
      - run: uv pip install --python .venv/bin/python --reinstall dist/*.whl
      - run: cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/.venv/bin/fleet-copilot" --tenant acme-001 ask "Which devices are low on disk space?"
